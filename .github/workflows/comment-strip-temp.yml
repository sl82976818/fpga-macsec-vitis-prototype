name: Temporary MACsec comment strip

on:
  push:
    branches:
      - agent/comment-strip

permissions:
  contents: write

jobs:
  strip-comments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/comment-strip
          fetch-depth: 0

      - name: Strip non-functional comments from src/macsec
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('src/macsec')
          FILES = sorted(list(ROOT.glob('*.v')) + list(ROOT.glob('*.vh')))
          if len(FILES) != 9:
              raise SystemExit(f'Expected 9 src/macsec RTL files, found {len(FILES)}: {FILES}')

          directive_re = re.compile(
              r'\b(?:synthesis|synopsys|translate_(?:off|on)|verilator|pragma|cadence|altera|xilinx)\b',
              re.IGNORECASE,
          )

          def leading_header_end(text: str) -> int:
              if not text.startswith('// SPDX-License-Identifier:'):
                  raise ValueError('missing expected SPDX header')
              pos = 0
              lines = text.splitlines(keepends=True)
              seen_comment = False
              for line in lines:
                  stripped = line.strip()
                  if stripped == '' or stripped.startswith('//'):
                      if stripped.startswith('//'):
                          seen_comment = True
                      pos += len(line)
                      continue
                  break
              if not seen_comment:
                  raise ValueError('no leading license header')
              return pos

          def strip_body_comments(body: str) -> str:
              out = []
              i = 0
              n = len(body)
              state = 'normal'
              block_buf = []
              line_buf = []

              while i < n:
                  c = body[i]
                  nxt = body[i+1] if i + 1 < n else ''

                  if state == 'string':
                      out.append(c)
                      if c == '\\' and i + 1 < n:
                          out.append(body[i+1])
                          i += 2
                          continue
                      if c == '"':
                          state = 'normal'
                      i += 1
                      continue

                  if state == 'line_comment':
                      if c == '\n':
                          comment = ''.join(line_buf)
                          if directive_re.search(comment):
                              out.append('//')
                              out.append(comment)
                          out.append('\n')
                          line_buf = []
                          state = 'normal'
                      else:
                          line_buf.append(c)
                      i += 1
                      continue

                  if state == 'block_comment':
                      if c == '*' and nxt == '/':
                          comment = ''.join(block_buf)
                          if directive_re.search(comment):
                              out.append('/*')
                              out.append(comment)
                              out.append('*/')
                          else:
                              if out and not out[-1].isspace():
                                  out.append(' ')
                          block_buf = []
                          state = 'normal'
                          i += 2
                          continue
                      block_buf.append(c)
                      if c == '\n':
                          out.append('\n')
                      i += 1
                      continue

                  if c == '"':
                      out.append(c)
                      state = 'string'
                      i += 1
                      continue
                  if c == '/' and nxt == '/':
                      state = 'line_comment'
                      line_buf = []
                      i += 2
                      continue
                  if c == '/' and nxt == '*':
                      state = 'block_comment'
                      block_buf = []
                      i += 2
                      continue

                  out.append(c)
                  i += 1

              if state == 'line_comment':
                  comment = ''.join(line_buf)
                  if directive_re.search(comment):
                      out.append('//')
                      out.append(comment)
              elif state == 'block_comment':
                  raise ValueError('unterminated block comment')
              elif state == 'string':
                  raise ValueError('unterminated string literal')

              text = ''.join(out)
              text = '\n'.join(line.rstrip() for line in text.split('\n'))
              text = re.sub(r'\n{4,}', '\n\n\n', text)
              return text

          def strip_all_comments_for_signature(text: str) -> str:
              out = []
              i = 0
              n = len(text)
              state = 'normal'
              while i < n:
                  c = text[i]
                  nxt = text[i+1] if i + 1 < n else ''
                  if state == 'string':
                      out.append(c)
                      if c == '\\' and i + 1 < n:
                          out.append(text[i+1])
                          i += 2
                          continue
                      if c == '"':
                          state = 'normal'
                      i += 1
                      continue
                  if state == 'line_comment':
                      if c == '\n':
                          state = 'normal'
                      i += 1
                      continue
                  if state == 'block_comment':
                      if c == '*' and nxt == '/':
                          state = 'normal'
                          i += 2
                      else:
                          i += 1
                      continue
                  if c == '"':
                      out.append(c)
                      state = 'string'
                      i += 1
                      continue
                  if c == '/' and nxt == '/':
                      state = 'line_comment'
                      i += 2
                      continue
                  if c == '/' and nxt == '*':
                      state = 'block_comment'
                      i += 2
                      continue
                  if not c.isspace():
                      out.append(c)
                  i += 1
              if state in ('block_comment', 'string'):
                  raise ValueError(f'unterminated lexical state: {state}')
              return ''.join(out)

          total_before = 0
          total_after = 0
          for path in FILES:
              original = path.read_text(encoding='utf-8')
              h_end = leading_header_end(original)
              header = original[:h_end]
              body = original[h_end:]
              cleaned = header + strip_body_comments(body)
              if not cleaned.endswith('\n'):
                  cleaned += '\n'

              if strip_all_comments_for_signature(original) != strip_all_comments_for_signature(cleaned):
                  raise SystemExit(f'NON_COMMENT_TOKEN_CHANGE: {path}')

              before = original.count('//') + original.count('/*')
              after = cleaned.count('//') + cleaned.count('/*')
              total_before += before
              total_after += after
              path.write_text(cleaned, encoding='utf-8')
              print(f'{path}: comment markers {before} -> {after}')

          print(f'TOTAL comment markers: {total_before} -> {total_after}')
          PY

      - name: Validate diff is limited to src/macsec comments
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -v '^src/macsec/' ; then
            echo 'Unexpected file change outside src/macsec before self-cleanup.' >&2
            exit 1
          fi

      - name: Commit cleaned RTL and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/comment-strip-temp.yml
          git add src/macsec
          git commit -m "Remove comments from MACsec RTL"
          git push origin HEAD:agent/comment-strip
